[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-db-comparison-lab"
version = "0.1.0"
description = "Comparison lab for OpenSearch, pgvector, Chroma and Pinecone adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "pytest>=8.0",
  "opensearch-py>=2.0",
  "psycopg[binary]>=3.0",
  "pgvector>=0.3.6",
  "chromadb>=0.5.0",
  "pinecone>=5.0",
]

[project.scripts]
vector-db-lab = "vector_db_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
